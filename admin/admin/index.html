<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d2344">
<title>SCOUT Website & Admin</title>


<style>
:root{
 --black:#111111;--text:#171717;--muted:#6f6f73;--bg:#f7f7f7;--card:#ffffff;--line:#ececec;
 --green:#c0f070;--green-dark:#6d9f35;--lime:#eefbdc;--orange:#ff7a00;--orange-soft:#fff0e2;
 --yellow:#ffc043;--yellow-soft:#fff7dc;--blue:#2f80ed;--blue-soft:#eaf3ff;--purple:#7d5cff;--purple-soft:#f0ecff;
 --red:#e94b4b;--red-soft:#fff0f0;--shadow:0 8px 22px rgba(0,0,0,.06)
}
*{box-sizing:border-box}
body{margin:0;background:#e8e8e8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:440px;min-height:100vh;margin:auto;background:var(--bg);position:relative;padding-bottom:86px}
header{position:sticky;top:0;z-index:50;background:rgba(247,247,247,.97);backdrop-filter:blur(18px);padding:12px 14px 10px;border-bottom:1px solid rgba(0,0,0,.04)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:950;letter-spacing:-.8px}
.logo-badge{width:30px;height:30px;border-radius:9px;background:var(--green);position:relative}
.logo-badge:before{content:"";position:absolute;width:8px;height:8px;border:3px solid #fff;border-radius:50%;left:8px;top:6px}
.logo-badge:after{content:"";position:absolute;width:3px;height:9px;background:#fff;left:14px;top:16px;border-radius:2px}
.role{display:flex;background:#ededed;border-radius:10px;padding:3px;max-width:248px;overflow:auto}
.role button{border:0;background:transparent;color:#666;font-size:10px;font-weight:850;padding:7px 9px;border-radius:8px;white-space:nowrap}
.role button.active{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.08)}
main{padding:14px}.screen{display:none}.screen.active{display:block}
.hero{background:linear-gradient(145deg,#111,#202020);color:#fff;border-radius:22px;padding:21px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"⚡";position:absolute;right:18px;top:10px;font-size:74px;opacity:.06}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:900;color:#d9f8a5}
h1{font-size:28px;line-height:1.02;margin:7px 0 10px;letter-spacing:-1px}
.hero p{font-size:13px;color:#d6d6d6;line-height:1.5;margin:0;max-width:320px}
.section{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 9px}.section h2{font-size:17px;margin:0;letter-spacing:-.3px}.section span{font-size:10px;color:var(--muted)}
.card{background:#fff;border:0;border-radius:18px;padding:15px;box-shadow:var(--shadow);margin-bottom:11px}
.card.flush{padding:0;overflow:hidden}.row,.headrow{display:flex;justify-content:space-between;gap:11px;align-items:flex-start}
.title{font-size:15px;font-weight:900;letter-spacing:-.2px}.sub{font-size:11px;color:var(--muted);line-height:1.45;margin-top:3px}
.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.orange{background:var(--green);color:white}.btn.navy{background:#111;color:white}.btn.light{background:#f2f2f2;color:#111}.btn.soft{background:#f2f2f2;color:#111}.btn.green{background:var(--green);color:white}.btn.red{background:var(--red-soft);color:#a72828}.btn.full{width:100%}
.actions{display:flex;gap:8px;margin-top:13px}.actions .btn{flex:1;font-size:11px;padding:10px 9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f5f5f5;border-radius:14px;padding:11px}.stat b{font-size:18px;display:block}.stat span{font-size:9px;color:var(--muted)}
.pill{border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900;background:#f1f1f1;color:#444;white-space:nowrap}
.pill.green{background:var(--lime);color:#547b29}.pill.blue{background:var(--blue-soft);color:#245e9f}.pill.yellow{background:var(--yellow-soft);color:#8c6200}.pill.purple{background:var(--purple-soft);color:#5c48b4}.pill.red{background:var(--red-soft);color:#9f2c31}
label{font-size:11px;font-weight:850;display:block;margin:12px 0 6px}
input,select,textarea{width:100%;border:1px solid #dfdfdf;border-radius:13px;padding:12px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(192,240,112,.10)}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.notice{background:#f4f4f4;border:0;color:#444;border-radius:14px;padding:12px;font-size:11px;line-height:1.45;margin:11px 0}
.notice.green{background:var(--lime);color:#547b29}.notice.blue{background:var(--blue-soft);color:#245088}.notice.red{background:var(--red-soft);color:#8e2529}
.menu{display:grid;gap:9px}
.menu-item{display:flex;justify-content:space-between;align-items:center;background:#fff;border:0;border-radius:16px;padding:14px 13px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.menu-left{display:flex;gap:11px;align-items:center}
.icon{width:38px;height:38px;border-radius:12px;background:var(--lime);display:grid;place-items:center;font-size:17px;color:#547b29}
.menu-item:nth-child(4n+2) .icon{background:var(--orange-soft);color:#b65400}
.menu-item:nth-child(4n+3) .icon{background:var(--blue-soft);color:#245e9f}
.menu-item:nth-child(4n+4) .icon{background:var(--purple-soft);color:#5c48b4}
.menu-item b{font-size:12px}.menu-item span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:0;background:#ededed;color:#666;border-radius:999px;padding:8px 11px;font-size:9px;font-weight:850;white-space:nowrap}
.tabs button.active{background:#111;color:#fff}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--orange-soft);display:grid;place-items:center;font-weight:900;color:#a94700;flex:none}
.list-row{display:flex;gap:11px;padding:14px;border-bottom:1px solid #ededed;align-items:flex-start}.list-row:last-child{border-bottom:0}.grow{flex:1}
.skills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.skill{font-size:9px;background:#f1f1f1;color:#52525b;padding:5px 7px;border-radius:999px}
.search{position:relative}.search input{padding-left:39px;background:white;border:0;box-shadow:0 3px 12px rgba(0,0,0,.04)}.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:21px;color:#777}
.progress{height:7px;background:#e9e9e9;border-radius:999px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#d4f79a)}
.timeline{display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}.timeline .on{color:var(--green-dark);font-weight:900}

.map{
  height:310px;border-radius:20px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  background:
    linear-gradient(92deg,transparent 0 22%,rgba(205,205,205,.6) 22% 25%,transparent 25% 52%,rgba(212,212,212,.7) 52% 55%,transparent 55% 78%,rgba(205,205,205,.6) 78% 81%,transparent 81%),
    linear-gradient(12deg,transparent 0 20%,rgba(205,205,205,.65) 20% 23%,transparent 23% 48%,rgba(210,210,210,.7) 48% 51%,transparent 51% 72%,rgba(205,205,205,.65) 72% 75%,transparent 75%),
    linear-gradient(35deg,#f4f4f4 25%,#fafafa 25% 50%,#f0f0f0 50% 75%,#fafafa 75%);
  background-size:100% 100%,100% 100%,48px 48px;
}
.map:before,.map:after{content:"";position:absolute;inset:auto;border-radius:50%;pointer-events:none}
.map:before{
  width:230px;height:230px;left:50%;top:48%;transform:translate(-50%,-50%);
  border:2px solid rgba(192,240,112,.22);
  box-shadow:0 0 0 38px rgba(192,240,112,.05),0 0 0 78px rgba(192,240,112,.025);
  animation:none;
}
.map:after{
  width:72px;height:72px;left:50%;top:48%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(192,240,112,.16) 0 35%,rgba(192,240,112,0) 70%);
  animation:none;
}
.map .center{
  position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);
  width:58px;height:58px;background:var(--green);color:#fff;border-radius:50%;
  display:grid;place-items:center;font-size:21px;box-shadow:0 0 0 9px rgba(192,240,112,.12);
  z-index:6;
}
.map .road-label{
  position:absolute;background:rgba(255,255,255,.92);border-radius:6px;padding:3px 6px;
  font-size:8px;font-weight:800;color:#777;box-shadow:0 1px 5px rgba(0,0,0,.06);z-index:2;
}
.map .poi{
  position:absolute;width:24px;height:24px;border-radius:8px;background:#fff;
  display:grid;place-items:center;font-size:12px;box-shadow:0 2px 7px rgba(0,0,0,.08);z-index:2;
}
.map .route{
  position:absolute;height:3px;background:linear-gradient(90deg,var(--green),rgba(192,240,112,.05));
  border-radius:999px;transform-origin:left center;z-index:1;overflow:hidden;
}
.map .route:after{
  content:"";position:absolute;left:-30%;top:0;width:30%;height:100%;background:#fff;
  opacity:.85;animation:none;
}
.person{
  position:absolute;width:38px;height:38px;border:3px solid #111;background:#fff;border-radius:50%;
  display:grid;place-items:center;font-size:9px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.10);
  z-index:5;transition:all .9s ease;
}
.person:after{
  content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--green);
  right:-2px;bottom:0;border:2px solid #fff;
}
.person.moving-a{animation:none;opacity:.75}50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}}
@keyframes softPulse{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.9)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
@keyframes routeMove{from{left:-30%}to{left:100%}}
@keyframes moveA{0%{left:17%;top:21%}50%{left:25%;top:29%}100%{left:34%;top:36%}}
@keyframes moveB{0%{left:72%;top:18%}50%{left:66%;top:27%}100%{left:59%;top:34%}}
@keyframes moveC{0%{left:77%;top:68%}50%{left:69%;top:62%}100%{left:61%;top:57%}}
@keyframes moveD{0%{left:27%;top:70%}50%{left:33%;top:63%}100%{left:39%;top:57%}}

.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(440px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.98);backdrop-filter:blur(14px);border-top:1px solid #ececec;padding:7px 6px 11px;z-index:40}
.bottomnav button{border:0;background:transparent;color:#777;font-size:9px;font-weight:800;padding:7px 2px;border-radius:10px}.bottomnav button strong{display:block;font-size:18px}.bottomnav button.active{color:var(--green-dark);background:var(--lime)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;width:min(395px,calc(100% - 30px));background:#111;color:#fff;border-radius:14px;padding:12px 14px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;z-index:80}.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:70}.modal.show{display:flex}.sheet{width:min(440px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px 28px}.handle{width:43px;height:5px;background:#d6d6d6;border-radius:999px;margin:0 auto 15px}
.hidden{display:none!important}
.kpi4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi{background:#fff;border:0;border-radius:16px;padding:13px;box-shadow:var(--shadow)}.kpi b{display:block;font-size:20px}.kpi span{font-size:9px;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{text-align:left;padding:10px 6px;border-bottom:1px solid #ededed}.table th{color:#777;font-weight:800}
.toggle{width:42px;height:24px;background:#d7d7d7;border-radius:999px;padding:3px}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--green)}.toggle.on i{transform:translateX(18px)}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.category{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.04)}.category .emoji{font-size:24px;display:block;margin-bottom:5px}.category b{font-size:10px}

.avail-calendar{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}
.avail-cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.avail-cal-head b{font-size:14px}.avail-cal-head span{font-size:10px;color:var(--muted)}
.avail-week,.avail-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.avail-week div{text-align:center;font-size:9px;color:var(--muted);font-weight:800;padding:4px 0}
.avail-day{border:0;background:#f3f3f3;border-radius:11px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:850;color:#333}
.avail-day small{font-size:7px;color:var(--muted);font-weight:800}
.avail-day.selected{background:var(--lime);color:#547b29;box-shadow:inset 0 0 0 1px rgba(192,240,112,.18)}
.avail-day.selected small{color:#547b29}
.avail-day.partial{background:var(--yellow-soft);color:#8c6200}
.avail-day.off{opacity:.38}
.avail-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:9px;color:var(--muted)}
.avail-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:-1px}


.vacancy-calendar{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin:12px 0}
.vacancy-cal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.vacancy-cal-head b{font-size:14px}.vacancy-cal-head span{font-size:10px;color:var(--muted)}
.vacancy-week,.vacancy-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.vacancy-week div{text-align:center;font-size:9px;color:var(--muted);font-weight:800;padding:4px 0}
.vacancy-day{border:0;background:#f3f3f3;border-radius:11px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:850;color:#333}
.vacancy-day small{font-size:7px;color:var(--muted);font-weight:800}
.vacancy-day.selected{background:var(--lime);color:#547b29;box-shadow:inset 0 0 0 1px rgba(192,240,112,.18)}
.vacancy-day.selected small{color:#547b29}
.vacancy-day.today{box-shadow:inset 0 0 0 2px var(--green)}
.vacancy-day.off{opacity:.35}
.vacancy-summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.vacancy-chip{background:var(--lime);color:#547b29;border-radius:999px;padding:6px 8px;font-size:9px;font-weight:850}
.shift-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}


.day-shifts{margin-top:12px;display:grid;gap:8px}
.day-shift{background:#f7f7f7;border-radius:14px;padding:11px}
.day-shift-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-shift-head b{font-size:12px}.day-shift-head span{font-size:9px;color:var(--muted)}
.day-shift-times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.day-shift-total{margin-top:8px;font-size:10px;color:var(--muted)}
.booking-total{background:var(--lime);color:#547b29;border-radius:14px;padding:12px;margin-top:12px}
.booking-total b{display:block;font-size:18px;margin-top:2px}


.cost-breakdown{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:14px}
.cost-breakdown-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.cost-breakdown-head b{font-size:14px}.cost-breakdown-head span{font-size:9px;color:var(--muted)}
.cost-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #ededed;font-size:11px}
.cost-line:last-child{border-bottom:0}
.cost-line span{color:var(--muted)}
.cost-line strong{font-size:11px}
.cost-line.subtotal{margin-top:3px;font-weight:850}
.cost-line.total-ex{font-weight:900;color:#111}
.cost-line.total-inc{background:var(--lime);margin:8px -4px -3px;padding:12px 10px;border-radius:13px;border:0;color:#547b29}
.cost-line.total-inc span,.cost-line.total-inc strong{color:#547b29;font-size:13px;font-weight:950}
.cost-note{font-size:9px;color:var(--muted);line-height:1.4;margin-top:9px}


/* Fun + interactive layer */
.hero .btn{position:relative;overflow:hidden}
.hero .btn:after{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);transform:translateX(-70%);animation:none;cursor:pointer;position:relative;overflow:hidden}
.category:active{transform:scale(.94)}
.category:hover{transform:translateY(-2px)}
.category:after{content:"";position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(192,240,112,.08);right:-12px;bottom:-12px}
.menu-item,.card,.btn{transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.menu-item:active,.card:active{transform:scale(.985)}
.btn:active{transform:scale(.96)}
.fun-banner{display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,var(--lime),#f7fff9);border-radius:17px;padding:13px;margin:12px 0;box-shadow:var(--shadow)}
.fun-banner .fun-icon{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;font-size:22px}
.fun-banner b{font-size:12px}.fun-banner span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.live-chip{display:inline-flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900}
.live-chip i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(192,240,112,.45);animation:none;background:#ececec;border-radius:999px;overflow:hidden;margin-top:8px}
.mini-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),#d4f79a);border-radius:999px;transition:width .5s ease}
.badge-pop{animation:none;opacity:0}80%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.success-burst{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.success-burst span{position:absolute;top:45%;left:50%;font-size:18px;animation:none;opacity:0}}
.scout-streak{display:flex;align-items:center;gap:8px;background:var(--orange-soft);color:#9f4d00;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900;width:max-content}
.achievement-row{display:flex;gap:8px;overflow:auto;padding-bottom:2px}
.achievement{min-width:88px;background:#fff;border-radius:15px;padding:11px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.achievement .emoji{font-size:24px;display:block;margin-bottom:5px}.achievement b{font-size:9px}
.interactive-toggle{display:flex;background:#ededed;border-radius:999px;padding:3px;margin-top:8px}
.interactive-toggle button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 9px;font-size:9px;font-weight:850;color:#666}
.interactive-toggle button.active{background:#fff;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.08)}





/* SCOUT Operations Centre */
.ops-wrap{display:grid;gap:12px}
.ops-hero{background:#111;color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden}
.ops-hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(192,240,112,.10);right:-60px;top:-60px}
.ops-hero h2{margin:0 0 5px;font-size:20px}.ops-hero p{margin:0;color:#cfcfcf;font-size:11px}
.ops-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ops-kpi{background:#fff;border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.ops-kpi b{font-size:20px;display:block}.ops-kpi span{font-size:9px;color:var(--muted)}
.ops-alert{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.ops-alert .signal{width:34px;height:34px;border-radius:11px;background:var(--red-soft);display:grid;place-items:center}
.ops-alert b{font-size:12px}.ops-alert span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.ops-live-map{height:280px;border-radius:18px;position:relative;overflow:hidden;background:
linear-gradient(85deg,transparent 0 24%,#dedede 24% 27%,transparent 27% 51%,#e1e1e1 51% 54%,transparent 54% 76%,#d9d9d9 76% 79%,transparent 79%),
linear-gradient(8deg,transparent 0 22%,#dfdfdf 22% 25%,transparent 25% 48%,#e4e4e4 48% 51%,transparent 51% 73%,#dddddd 73% 76%,transparent 76%),
#f4f4f4;box-shadow:var(--shadow)}
.ops-live-map .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;z-index:5}
.ops-worker{position:absolute;width:32px;height:32px;border-radius:50%;background:#fff;border:3px solid var(--green);display:grid;place-items:center;font-size:8px;font-weight:900;z-index:4;animation:none;gap:7px}
.ops-event{display:flex;gap:9px;align-items:center;background:#fff;border-radius:13px;padding:10px 11px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.ops-event time{font-size:8px;color:var(--muted);width:42px}.ops-event b{font-size:10px}.ops-event span{font-size:9px;color:var(--muted)}
.ops-dispatch-card{background:#fff;border-radius:17px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.ops-status-line{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ops-candidate-list{display:grid;gap:8px;margin-top:10px}
.ops-candidate{display:flex;gap:9px;align-items:center;background:#f7f7f7;border-radius:13px;padding:9px}
.ops-candidate .avatar{width:38px;height:38px}.ops-candidate .grow b{font-size:10px}.ops-candidate .grow span{display:block;font-size:8px;color:var(--muted)}
.ops-action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.ops-action{border:0;background:#f2f2f2;border-radius:12px;padding:10px;font-size:9px;font-weight:850}
.ops-action.primary{background:#111;color:#fff}.ops-action.warn{background:var(--orange-soft);color:#9f4d00}.ops-action.danger{background:var(--red-soft);color:#9f2b2f}
.ops-side-list{display:grid;gap:8px}
.ops-profile-head{display:flex;gap:11px;align-items:center}
.ops-profile-head .avatar{width:56px;height:56px}
.ops-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.ops-metric{background:#f5f5f5;border-radius:12px;padding:10px}.ops-metric b{display:block;font-size:15px}.ops-metric span{font-size:8px;color:var(--muted)}
.ops-compliance{display:grid;gap:7px;margin-top:10px}
.ops-compliance-row{display:flex;justify-content:space-between;gap:10px;padding:10px;background:#f7f7f7;border-radius:12px}
.ops-compliance-row b{font-size:10px}.ops-compliance-row span{font-size:8px;color:var(--muted)}
.ops-report-bars{display:grid;gap:8px}
.ops-report-row{display:grid;grid-template-columns:90px 1fr 45px;gap:8px;align-items:center;font-size:9px}
.ops-report-track{height:9px;background:#ececec;border-radius:999px;overflow:hidden}.ops-report-track i{display:block;height:100%;background:var(--green)}
.ops-assistant{position:fixed;right:max(calc((100vw - 440px)/2 + 14px),14px);bottom:94px;z-index:90}
.ops-assistant button{width:48px;height:48px;border-radius:50%;border:0;background:#111;color:#fff;font-size:19px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.ops-assistant-panel{position:fixed;right:max(calc((100vw - 440px)/2 + 14px),14px);bottom:150px;width:min(360px,calc(100% - 28px));background:#fff;border-radius:18px;padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);z-index:91;display:none}
.ops-assistant-panel.show{display:block}
.ops-assistant-panel h3{margin:0 0 6px;font-size:15px}
.ops-prompts{display:grid;gap:6px}.ops-prompts button{border:0;background:#f4f4f4;border-radius:10px;padding:9px;text-align:left;font-size:9px;font-weight:800}


.ops-kpi.clickable{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease}
.ops-kpi.clickable:hover{transform:translateY(-1px)}
.ops-kpi.clickable:active{transform:scale(.98)}
.ops-detail-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ops-back{border:0;background:#f1f1f1;color:#111;border-radius:11px;padding:9px 11px;font-size:10px;font-weight:900}
.ops-detail-head h2{margin:0;font-size:18px}
.ops-detail-list{display:grid;gap:9px}
.ops-detail-row{background:#fff;border-radius:15px;padding:12px;box-shadow:var(--shadow)}
.ops-detail-row .headrow{align-items:center}


.real-map{height:300px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);position:relative}
.real-map .leaflet-control-zoom a{color:#111}
.scout-map-badge{background:#111;color:#fff;border:3px solid #fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:9px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.scout-map-badge.green{background:var(--green)}.scout-map-badge.orange{background:var(--orange)}.scout-map-badge.red{background:var(--red)}.scout-map-badge.blue{background:var(--blue)}
.map-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:8px;color:var(--muted)}
.map-legend span{display:flex;align-items:center;gap:4px}.map-legend i{width:8px;height:8px;border-radius:50%}

.bundled-map:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(0,0,0,.02));
  pointer-events:none;
}
.map-radius{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:205px;height:205px;border-radius:50%;border:2px solid rgba(192,240,112,.7);
  background:rgba(192,240,112,.07);box-shadow:0 0 0 25px rgba(192,240,112,.03);
  animation:none;z-index:2;pointer-events:none;
}
.map-pin{
  position:absolute;width:38px;height:38px;border-radius:50%;
  border:3px solid #fff;display:grid;place-items:center;font-size:9px;font-weight:900;color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:4;cursor:pointer;transition:.2s ease;
}
.map-pin:hover{transform:scale(1.08)}
.map-pin.green{background:var(--green)}.map-pin.blue{background:var(--blue)}
.map-pin.orange{background:var(--orange)}.map-pin.red{background:var(--red)}.map-pin.black{background:#111}
.map-pin .tip{
  display:none;position:absolute;bottom:45px;left:50%;transform:translateX(-50%);
  background:#111;color:#fff;padding:6px 8px;border-radius:8px;white-space:nowrap;font-size:8px;
}
.map-pin:hover .tip{display:block}
.map-zoom{position:absolute;right:10px;top:10px;z-index:7;display:grid;gap:5px}
.map-zoom button{width:32px;height:32px;border:0;border-radius:9px;background:#fff;font-size:17px;font-weight:900;box-shadow:0 2px 7px rgba(0,0,0,.12)}
.map-caption{position:absolute;left:10px;bottom:10px;z-index:7;background:rgba(255,255,255,.94);border-radius:9px;padding:6px 8px;font-size:8px;color:#555}
.map-stage{position:absolute;inset:0;transition:transform .25s ease;transform-origin:center}
.map-moving-a{animation:none;margin-top:0}100%{margin-left:16px;margin-top:-9px}}
@keyframes mapMoveB{0%{margin-left:0;margin-top:0}100%{margin-left:-12px;margin-top:11px}}


.working-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#111;border:3px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.45);z-index:6;cursor:pointer}
.working-dot:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(17,17,17,.22);animation:none;position:absolute;bottom:19px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:6px 8px;border-radius:8px;white-space:nowrap;font-size:8px;font-weight:800}
.working-dot:hover .tip{display:block}
@keyframes workPulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.working-count{position:absolute;left:10px;top:10px;z-index:7;background:#111;color:#fff;border-radius:999px;padding:7px 10px;font-size:8px;font-weight:900}


.bundled-map .map-stage{counter-reset:working}
.bundled-map .working-dot{counter-increment:working}
.bundled-map .working-dot:before{
  content:"";position:absolute;inset:-3px;border-radius:50%;background:#111;z-index:-1
}


/* Admin control centre expansion */
.admin-searchbar{display:flex;gap:8px;margin-bottom:12px}
.admin-searchbar input{flex:1}
.admin-searchbar button{flex:none}
.alert-strip{display:grid;gap:7px}
.alert-item{display:flex;gap:9px;align-items:flex-start;background:#fff;border-radius:14px;padding:11px;box-shadow:var(--shadow)}
.alert-item .alert-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}
.alert-item b{font-size:10px}.alert-item span{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.exception-grid{display:grid;gap:8px}
.exception-card{background:#fff;border-radius:15px;padding:12px;box-shadow:var(--shadow)}
.exception-card .meta2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.exception-card .meta2 div{background:#f5f5f5;border-radius:10px;padding:8px}
.exception-card .meta2 b{font-size:10px;display:block}.exception-card .meta2 span{font-size:8px;color:var(--muted)}
.timeline-log{display:grid;gap:7px}
.timeline-log .log-row{display:grid;grid-template-columns:55px 1fr;gap:9px;background:#fff;border-radius:12px;padding:9px;box-shadow:0 3px 10px rgba(0,0,0,.03)}
.timeline-log time{font-size:8px;color:var(--muted)}.timeline-log b{font-size:9px}.timeline-log span{font-size:8px;color:var(--muted)}
.permission-grid{display:grid;gap:8px}
.permission-row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border-radius:13px;padding:11px;box-shadow:var(--shadow)}
.permission-row b{font-size:10px}.permission-row span{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.audit-table{width:100%;border-collapse:collapse;font-size:9px}.audit-table th,.audit-table td{padding:8px 5px;border-bottom:1px solid #eee;text-align:left}.audit-table th{color:var(--muted)}
.incident-severity{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.incident-severity .pill{cursor:pointer}
.payroll-row{display:flex;justify-content:space-between;gap:8px;background:#fff;border-radius:13px;padding:11px;box-shadow:var(--shadow)}
.payroll-row b{font-size:10px}.payroll-row span{font-size:8px;color:var(--muted)}
.comms-tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.comms-tabs button{border:0;background:#eee;border-radius:999px;padding:7px 9px;font-size:8px;font-weight:850}
.search-results{display:grid;gap:8px;margin-top:10px}
.search-result{background:#fff;border-radius:13px;padding:11px;box-shadow:var(--shadow)}
.search-result b{font-size:10px}.search-result span{display:block;font-size:8px;color:var(--muted)}


.admin-universal-back{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.admin-universal-back button{border:0;background:#f0f0f0;color:#111;border-radius:11px;padding:9px 12px;font-size:10px;font-weight:900}
.admin-universal-back span{font-size:9px;color:var(--muted)}


/* Candidate onboarding prototype */
.onboard-shell{display:grid;gap:12px}
.onboard-progress{display:flex;gap:5px;margin:6px 0 14px}
.onboard-progress i{height:6px;flex:1;border-radius:999px;background:#e9e9e9}
.onboard-progress i.on{background:var(--green)}
.onboard-step-card{background:#fff;border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.onboard-choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.onboard-choice button{border:0;background:#f4f4f4;border-radius:13px;padding:12px;text-align:left;font-size:10px;font-weight:850}
.onboard-choice button.active{background:var(--lime);color:#547b29}
.verify-row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#f7f7f7;border-radius:13px;padding:11px;margin-top:8px}
.verify-row b{font-size:10px}.verify-row span{font-size:8px;color:var(--muted);display:block;margin-top:2px}
.onboard-footer{display:flex;gap:8px;margin-top:12px}
.onboard-footer .btn{flex:1}
.approval-badge{width:92px;height:92px;border-radius:50%;background:var(--lime);color:#547b29;display:grid;place-items:center;font-size:40px;margin:8px auto 14px}
.screening-score{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.screening-score .stat{background:#f5f5f5}


/* Testing/UAT + WHS */
.uat-banner{background:linear-gradient(135deg,#111,#272727);color:#fff;border-radius:18px;padding:14px;margin-bottom:12px}
.uat-banner .headrow{align-items:center}.uat-banner .sub{color:#d5d5d5}
.uat-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.uat-step{background:rgba(255,255,255,.09);border-radius:10px;padding:8px 5px;text-align:center;font-size:8px;color:#ccc}
.uat-step.done{background:rgba(192,240,112,.22);color:#baf1d2}
.uat-step.active{background:#fff;color:#111;font-weight:900}
.whs-card{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}
.whs-status{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#f6f6f6;border-radius:13px;padding:11px;margin-top:8px}
.whs-status b{font-size:10px}.whs-status span{display:block;font-size:8px;color:var(--muted);margin-top:2px}
.whs-checks{display:grid;gap:8px;margin-top:10px}
.whs-check{display:flex;gap:9px;align-items:flex-start;background:#f7f7f7;border-radius:12px;padding:10px}
.whs-check input{width:auto;margin-top:2px}
.whs-check label{margin:0;font-size:10px;font-weight:750}
.whs-check small{display:block;color:var(--muted);font-size:8px;margin-top:2px;line-height:1.35}
.whs-alert{background:var(--red-soft);color:#8e2529;border-radius:13px;padding:11px;font-size:10px;margin:9px 0}
.whs-ready{background:var(--lime);color:#08623d;border-radius:13px;padding:11px;font-size:10px;margin:9px 0}
.link-card{cursor:pointer}.link-card:active{transform:scale(.985)}
.test-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.test-nav button{border:0;border-radius:12px;padding:10px;font-size:9px;font-weight:900;background:#f3f3f3}
.test-nav button.primary{background:var(--green);color:#fff}
.page-shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shortcut{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow);cursor:pointer}
.shortcut b{display:block;font-size:10px}.shortcut span{font-size:8px;color:var(--muted)}

function hoursBetween(start,end){
 if(!start||!end)return 0;
 const [sh,sm]=start.split(':').map(Number);
 const [eh,em]=end.split(':').map(Number);
 let mins=(eh*60+em)-(sh*60+sm);
 if(mins<0)mins+=24*60;
 return mins/60;
}

function money(v){return '$'+Number(v||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});}
function renderCostBreakdown(){
 const days=[...vacancyDays];
 const hours=days.reduce((sum,d)=>{
   const s=vacancyShiftTimes[d]||{start:'09:00',end:'17:00'};
   return sum+hoursBetween(s.start,s.end);
 },0);
 const rateEl=document.getElementById('rateInput');
 const rate=rateEl?Number(rateEl.value)||0:currentRate;
 const candidate=hours*rate;
 const superAmt=candidate*0.12;
 const pipl=candidate*0.02;
 const workcover=candidate*0.02;
 const margin=candidate*0.10;
 const exGst=candidate+superAmt+pipl+workcover+margin;
 const gst=exGst*0.10;
 const incGst=exGst+gst;
 const vals={
   costCandidate:candidate,costSuper:superAmt,costPipl:pipl,costWorkcover:workcover,
   costMargin:margin,costExGst:exGst,costGst:gst,costIncGst:incGst
 };
 Object.entries(vals).forEach(([id,val])=>{const el=document.getElementById(id);if(el)el.textContent=money(val);});
}

function updateShiftTime(day,key,value){
 if(!vacancyShiftTimes[day])vacancyShiftTimes[day]={start:'09:00',end:'17:00'};
 vacancyShiftTimes[day][key]=value;
 renderVacancyShiftRows();
}
function renderVacancyShiftRows(){
 const wrap=document.getElementById('dayShiftRows');
 if(!wrap)return;
 const days=[...vacancyDays].sort((a,b)=>a-b);
 if(!days.length){
   wrap.innerHTML='<div class="notice">Select one or more dates above to set shift times.</div>';
   const th=document.getElementById('totalScheduledHours');
   const tc=document.getElementById('totalScheduledCost');
   if(th)th.textContent='0 hours';
   if(tc)tc.textContent='Estimated labour: $0';
   return;
 }
 let totalHours=0;
 wrap.innerHTML=days.map(day=>{
   if(!vacancyShiftTimes[day])vacancyShiftTimes[day]={start:'09:00',end:'17:00'};
   const s=vacancyShiftTimes[day];
   const hrs=hoursBetween(s.start,s.end);
   totalHours+=hrs;
   return `<div class="day-shift">
     <div class="day-shift-head"><b>${day} August 2026</b><span>${hrs.toFixed(2).replace('.00','')} hrs</span></div>
     <div class="day-shift-times">
       <div><label>Start time</label><input type="time" value="${s.start}" onchange="updateShiftTime(${day},'start',this.value)"></div>
       <div><label>End time</label><input type="time" value="${s.end}" onchange="updateShiftTime(${day},'end',this.value)"></div>
     </div>
     <div class="public-holiday-row"><label>Public holiday for this shift?</label><input type="checkbox" ${publicHolidayDays.has(day)?'checked':''} onchange="togglePublicHoliday(${day},this.checked)"></div>
     <div class="day-shift-total">Scheduled for ${hrs.toFixed(2).replace('.00','')} hours</div>
   </div>`;
 }).join('');
 quotedHours=totalHours;
 const rateEl=document.getElementById('rateInput');
 const rate=rateEl?Number(rateEl.value)||currentRate:currentRate;
 const th=document.getElementById('totalScheduledHours');
 const tc=document.getElementById('totalScheduledCost');
 if(th)th.textContent=`${totalHours.toFixed(2).replace('.00','')} hours`;
 if(tc)tc.textContent=`Candidate wages: $${(totalHours*rate).toFixed(2)}`;
 renderCostBreakdown();
 setTimeout(renderPayEngine,0);
}

 selectedAward=el.value;
 const sum=document.getElementById('selectedAwardSummary');
 if(sum)sum.textContent='Award/instrument: '+(el.options[el.selectedIndex]?.text||'Not selected');
 const help=document.getElementById('awardHelp');
 const classEl=document.getElementById('classificationSelect');
 selectedClassification='';
 if(classEl){
   const data=AWARD_PAY_DATA[selectedAward];
   if(data){
     classEl.innerHTML='<option value="">Select classification</option>'+data.classifications.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('');
   } else {
     classEl.innerHTML='<option value="">SCOUT review required for this instrument</option>';
   }
 }
 if(!help)return;
 if(selectedAward==='NOT_SURE'){
   help.className='notice red';
   help.innerHTML='<b>SCOUT review required.</b> This job can be saved, but cannot be released until award/agreement and classification are confirmed.';
 }else if(selectedAward==='ENTERPRISE_AGREEMENT'){
   help.className='notice blue';
   help.innerHTML='<b>Registered agreement selected.</b> Automated minimum-rate validation is disabled until the agreement is configured.';
 }else if(selectedAward==='AWARD_FREE'){
   help.className='notice blue';
   help.innerHTML='<b>Award-free selected.</b> SCOUT must validate National Minimum Wage/NES requirements separately.';
 }else if(AWARD_PAY_DATA[selectedAward]){
   help.className='notice green';

 }else if(selectedAward){

 }else{
   help.className='notice blue';

 }
 renderPayEngine();
}

function dayOfWeekForAug2026(day){
 // 0=Sun...6=Sat
 return new Date(2026,7,day).getDay();
}
function hourNum(t){
 if(!t)return 0;
 const [h,m]=t.split(':').map(Number);
 return h+(m||0)/60;
}
function getClassification(){
 const data=AWARD_PAY_DATA[selectedAward];
 return data?.classifications.find(x=>x[0]===selectedClassification)||null;
}
function rateForShift(day,start,end){
 const data=AWARD_PAY_DATA[selectedAward], c=getClassification();
 if(!data||!c)return null;
 const base=c[2], dow=dayOfWeekForAug2026(day), startH=hourNum(start), endH=hourNum(end);
 let rate=base*(1+data.casualLoading), reason='Weekday casual ordinary', detail='';
 if(publicHolidayDays.has(day)){rate=base*data.penalties.publicHoliday;reason='Public holiday';}
 else if(dow===6){rate=base*data.penalties.saturday;reason='Saturday';}
 else if(dow===0){
   if(selectedAward==='MA000119'){
     rate=base*((['INTRO','L1','L2'].includes(selectedClassification))?data.penalties.sundayLow:data.penalties.sundayHigh);
   } else if(selectedAward==='MA000003'){
     rate=base*(selectedClassification==='L1'?data.penalties.sundayLow:data.penalties.sundayHigh);
   } else rate=base*data.penalties.sunday;
   reason='Sunday';
 } else {
   if(data.late){
     // conservative whole-shift display: calculate highest hourly component triggered within shift
     const crossesNight = startH< data.late.nightEnd || endH<=data.late.nightEnd || (endH<startH);
     const evening = startH>=data.late.eveningStart || endH>data.late.eveningStart || endH<startH;
     if(crossesNight){rate=base*1.25+data.late.nightAdd;reason='Weekday late-night component';detail='Includes '+money(data.late.nightAdd)+'/hr late-night addition';}
     else if(evening){rate=base*1.25+data.late.eveningAdd;reason='Weekday evening component';detail='Includes '+money(data.late.eveningAdd)+'/hr evening addition';}
   } else if(data.latePercent){
     const crossesNight=startH<data.latePercent.nightEnd || endH<=data.latePercent.nightEnd || endH<startH;
     const evening=startH>=data.latePercent.eveningStart || endH>data.latePercent.eveningStart || endH<startH;
     if(crossesNight){rate=base*data.latePercent.night;reason='Weekday midnight–6am';}
     else if(evening){rate=base*data.latePercent.evening;reason='Weekday 10pm–midnight';}
   }
   if(selectedAward==='MA000002' && (startH<7 || endH>19 || endH<startH)){detail='Outside ordinary spread — admin review required for shiftwork/overtime treatment';}
 }
 return {rate,reason,detail,base};
}
function renderPayEngine(){
 const data=AWARD_PAY_DATA[selectedAward], c=getClassification();
 const baseEl=document.getElementById('baseAwardRate'), ordinaryEl=document.getElementById('casualOrdinaryRate'),
       minEl=document.getElementById('minimumShiftRate'), clientEl=document.getElementById('clientEnteredRate'),
       status=document.getElementById('rateStatus'), msg=document.getElementById('rateValidationMessage'),
       breakdown=document.getElementById('rateBreakdown');
 const rateInput=document.getElementById('rateInput');
 const client=rateInput?Number(rateInput.value)||0:currentRate;
 if(clientEl)clientEl.textContent=money(client);
 if(!data||!c||selectedEmploymentType!=='casual'){
   if(baseEl)baseEl.textContent='—'; if(ordinaryEl)ordinaryEl.textContent='—'; if(minEl)minEl.textContent='—';
   if(status){status.className='rate-status wait';status.textContent=selectedEmploymentType!=='casual'?'SCOUT review':'Select classification';}
   if(msg){msg.className='engine-warning';msg.innerHTML=selectedEmploymentType!=='casual'?'<b>MVP limitation:</b> automated validation currently supports adult casual employees only.':'Select a supported launch award and classification.';}
   if(breakdown)breakdown.innerHTML='';
   return;
 }
 if(baseEl)baseEl.textContent=money(c[2]);
 if(ordinaryEl)ordinaryEl.textContent=money(c[2]*1.25);
 const days=[...vacancyDays].sort((a,b)=>a-b);
 const rows=days.map(day=>{
   const s=vacancyShiftTimes[day]||{start:'09:00',end:'17:00'};
   const r=rateForShift(day,s.start,s.end);
   const hrs=hoursBetween(s.start,s.end);
   const payableHrs=Math.max(hrs,data.minEngagement||0);
   return {day,start:s.start,end:s.end,hrs,payableHrs,...r};
 }).filter(Boolean);
 const maxRate=rows.length?Math.max(...rows.map(r=>r.rate)):c[2]*1.25;
 if(minEl)minEl.textContent=money(maxRate);
 if(breakdown){
   breakdown.innerHTML=`<table class="rate-table"><tr><th>Date</th><th>Rule</th><th>Min rate</th><th>Payable hrs</th></tr>${rows.map(r=>`<tr><td>${r.day} Aug</td><td>${r.reason}${r.detail?'<br><span class="sub">'+r.detail+'</span>':''}</td><td><b>${money(r.rate)}/hr</b></td><td>${r.payableHrs.toFixed(2).replace('.00','')}</td></tr>`).join('')}</table><div class="engine-source">${data.note}</div>`;
 }
 const below=rows.some(r=>client+0.0001<r.rate);
 const review=selectedAward==='MA000002' && rows.some(r=>r.detail&&r.detail.includes('review'));
 if(status){
   status.className='rate-status '+(below?'bad':review?'wait':'ok');
   status.textContent=below?'Below award':review?'Review':'Rate compliant';
 }
 if(msg){
   if(below){
     const required=Math.max(...rows.map(r=>r.rate));
     msg.className='engine-warning';
     msg.innerHTML=`<b>Posting blocked.</b> The client rate of ${money(client)}/hr is below at least one calculated minimum. Increase the candidate rate to at least <b>${money(required)}/hr</b> for the selected shifts, subject to final award-rule validation.`;
   }else if(review){
     msg.className='engine-warning';
     msg.innerHTML='<b>Admin review required.</b> The entered rate is not below the displayed minimum, but this Clerks shift appears outside the ordinary spread and may require shiftwork/overtime treatment.';
   }else{
     msg.className='engine-ok';
     msg.innerHTML=`<b>Rate passes MVP validation.</b> ${money(client)}/hr is at or above the calculated minimum for all selected shifts.`;
   }
 }
 renderCostBreakdown();
}
function payEngineAllowsPosting(){
 const data=AWARD_PAY_DATA[selectedAward], c=getClassification();
 if(!data||!c||selectedEmploymentType!=='casual')return false;
 const client=Number(document.getElementById('rateInput')?.value)||0;
 const rows=[...vacancyDays].map(day=>{
   const s=vacancyShiftTimes[day]||{start:'09:00',end:'17:00'};
   return rateForShift(day,s.start,s.end);
 }).filter(Boolean);
 return rows.length>0 && rows.every(r=>client+0.0001>=r.rate);
}

function renderDispatchFlow(){
 const el=document.getElementById('dispatchFlowVisual');
 if(!el)return;
 const steps=[

function renderDispatchStatus(){
 const stage=document.getElementById('dispatchStageText');
 const timer=document.getElementById('dispatchTimerText');
 const app=document.getElementById('dispatchApplicantText');
 const threshold=document.getElementById('dispatchThresholdText');
 if(stage)stage.textContent=dispatchStageLabel();
 if(timer)timer.textContent=scoutConsultantTransfer?'—':`${dispatchMinutesRemaining()} min`;
 if(app)app.textContent=dispatchApplicants;
 if(threshold)threshold.textContent=dispatchApplicants>=5?'Expansion threshold met':'Expand if fewer than 5';

}
function startDispatchTimer(){
 stopDispatchTimer();
 dispatchTimerRunning=true;
 dispatchTimerHandle=setInterval(()=>{
   if(!dispatchTimerRunning||appointed||scoutConsultantTransfer)return;
   dispatchElapsed++;
   renderDispatchStatus();
   if(dispatchElapsed>=30){
     stopDispatchTimer();
     evaluateDispatchStage();
   }
 },1000); // prototype: 1 second = 1 minute
}
function stopDispatchTimer(){
 dispatchTimerRunning=false;
 if(dispatchTimerHandle){clearInterval(dispatchTimerHandle);dispatchTimerHandle=null;}
}
function evaluateDispatchStage(){
 if(appointed||scoutConsultantTransfer)return;
 if(dispatchApplicants>=5){
   toast(`${dispatchApplicants} candidates have applied. Radius expansion is not required; applications remain open.`);
   renderAll();
   return;
 }
 if(dispatchStage===1){
   dispatchStage=2;
   dispatchElapsed=0;
   toast('Fewer than 5 applicants. Expanding search to 10 km.');
   renderAll();
   setTimeout(startDispatchTimer,50);
   return;
 }
 if(dispatchStage===2){
   dispatchStage=4;
   dispatchElapsed=0;
   renderAll();
   setTimeout(showRateIncreaseDecision,60);
   return;
 }
 if(dispatchStage===3){
   transferToScoutConsultant();
 }
}

function applicantPool(){

function celebrate(){
 const burst=document.createElement('div');burst.className='success-burst';
 const bits=['✨','⚡','🎉','✅','💚','⭐'];
 for(let i=0;i<18;i++){
   const s=document.createElement('span');
   s.textContent=bits[i%bits.length];
   const a=(Math.PI*2*i)/18,dist=80+Math.random()*100;
   s.style.setProperty('--x',Math.cos(a)*dist+'px');
   s.style.setProperty('--y',Math.sin(a)*dist+'px');
   burst.appendChild(s);
 }
 document.body.appendChild(burst);setTimeout(()=>burst.remove(),1200);
}
function animateNearbyWorkers(){

}
