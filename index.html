<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03170f">
<title>SCOUT — Need staff today?</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03170f;font-family:Arial,sans-serif}
.page{position:relative;width:100%;max-width:1536px;margin:0 auto;line-height:0}
.hero{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;z-index:5;border-radius:12px}
.hotspot:focus{outline:3px solid #c8f323;outline-offset:3px}
.admin{left:83.5%;top:1.9%;width:13.6%;height:5.2%}
.hire{left:6.4%;top:75.1%;width:26.1%;height:5.1%}
.work{left:55.1%;top:75.1%;width:26.1%;height:5.1%}
.nav-business{left:37.8%;top:3.1%;width:8.8%;height:3%}
.nav-worker{left:49%;top:3.1%;width:7.5%;height:3%}
@media(max-width:700px){
  body{overflow-x:hidden}
  .page{width:185%;margin-left:-42.5%}
}
</style>
</head>
<body>
<main class="page">
  <img class="hero" src="./assets/scout-home.webp" alt="SCOUT staffing platform. Need staff today? SCOUT has you covered. Choose Looking to Hire or Looking for Work.">
  <a class="hotspot admin" href="./admin/" aria-label="Admin Login"></a>
  <a class="hotspot hire" href="./business/" aria-label="I'm Looking to Hire"></a>
  <a class="hotspot work" href="./worker/" aria-label="I'm Looking for Work"></a>
  <a class="hotspot nav-business" href="./business/" aria-label="For Businesses"></a>
  <a class="hotspot nav-worker" href="./worker/" aria-label="For Workers"></a>
</main>
</body>
</html>
